<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOEIC PTIT - Đăng nhập</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <div class="logo">
                <h1>TOEIC PTIT</h1>
                <p>Hệ thống luyện thi TOEIC</p>
            </div>


            <!-- Form đăng nhập -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Nhập tên đăng nhập"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Mật khẩu</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >
                </div>


                <button type="submit">
                    Đăng nhập
                </button>

            </form>


            <p id="authMessage" class="auth-message" role="alert"></p>


            <!-- Đăng ký -->
           <p class="register-text">
                Chưa có tài khoản?
                <a href="register.html">Đăng ký</a>
            </p>

            <p class="login-text hidden-form">
                Đã có tài khoản?
                <a href="#" id="loginLink">Đăng nhập</a>
            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="login.js?v=3"></script>

</body>

</html>
