<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOEIC PTIT - Đăng nhập</title>

    <link rel="stylesheet" href="style.css?v=11">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <div class="logo">
                <h1>TOEIC PTIT</h1>
                <p>Hệ thống luyện thi TOEIC</p>
            </div>

            <!-- Form đăng nhập -->
            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Nhập tên đăng nhập"
                        required
                        autocomplete="off"
                        style="color: #0f172a; background-color: #ffffff; -webkit-text-fill-color: #0f172a; caret-color: #0f172a;"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        autocomplete="off"
                        style="color: #0f172a; background-color: #ffffff; -webkit-text-fill-color: #0f172a; caret-color: #0f172a;"
                    >
                </div>

                <button type="submit">
                    Đăng nhập
                </button>

            </form>

            <p id="authMessage" class="auth-message" role="alert"></p>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="login.js?v=11"></script>

</body>

</html>
