<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - TOEIC PTIT</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">

            <h1>TOEIC PTIT</h1>

            <p>Tạo tài khoản mới</p>

        </div>


        <form id="registerForm">


            <div class="form-group">

                <label for="username">
                    Tên đăng nhập
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Nhập tên đăng nhập"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Xác nhận mật khẩu
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu"
                    required
                >

            </div>


            <p id="registerMessage" class="form-message"></p>


            <button type="submit">
                Đăng ký
            </button>


        </form>


        <p class="register-text">

            Đã có tài khoản?

            <a href="login.html">
                Đăng nhập
            </a>

        </p>

    </div>

</div>


<script src="register.js?v=4"></script>

</body>

</html>
